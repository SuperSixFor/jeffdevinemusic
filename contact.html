<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Jeff Devine</title>
  <meta name="description" content="Get in touch with Jeff Devine for performance inquiries, licensing, or commissions.">
  <meta name="author" content="Jeff Devine">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://jeffdevinemusic.com/contact.html">
  <meta name="theme-color" content="#F8F5F0">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Theme injected by js/config.js → SITE.theme -->
  <noscript><link rel="stylesheet" href="css/themes/theme-default.css"></noscript>


</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav__logo">Jeff <em>Devine</em></a>
    <ul class="nav__links">
      <li><a href="music.html">Music</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" class="nav__link--active">Contact</a></li>
    </ul>
  </nav>

  <section class="page-header">
    <div class="container">
      <div class="page-header__inner">
        <div class="label reveal">Get in Touch</div>
        <div class="rule reveal"></div>
        <h1 class="reveal">Contact</h1>
      </div>
    </div>
  </section>

  <section class="contact-section">
    <div class="container container--sm">

      <p class="contact-intro reveal"></p>

      <div class="contact-form reveal reveal-delay-1">
        <form method="POST"><!-- action set from config -->
          <div class="form-row">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required placeholder="Your name">
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required placeholder="your@email.com">
            </div>
          </div>

          <div class="form-group">
            <label for="subject">Subject</label>
            <select id="subject" name="subject">
              <option value="">Select a topic</option>
            </select>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required placeholder="Your message..."></textarea>
          </div>

          <button type="submit" class="btn btn--primary">Send Message</button>
        </form>
      </div>

      <div class="contact-direct reveal reveal-delay-2">
        <div class="label">Direct</div>
        <div class="rule"></div>
        <p>Prefer email? <a href="#" class="contact-email"></a></p>
      </div>

    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer__inner">
        <div>
          <div class="footer__logo"></div>
          <div class="footer__notes"></div>
        </div>
        <ul class="footer__links">
          <li><a href="music.html">Music</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
