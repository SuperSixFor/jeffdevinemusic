<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music — Jeff Devine</title>
  <meta name="description" content="Browse sacred choral works and solo classical guitar compositions by Jeff Devine. Scores, recordings, and sheet music.">
  <meta name="author" content="Jeff Devine">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://jeffdevinemusic.com/music.html">
  <meta name="theme-color" content="#F8F5F0">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Theme injected by js/config.js → SITE.theme -->
  <noscript><link rel="stylesheet" href="css/themes/theme-default.css"></noscript>


</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav__logo">Jeff <em>Devine</em></a>
    <div class="nav__right">
      <ul class="nav__links">
        <li><a href="about.html">About</a></li>
        <li><a href="music.html" class="nav__link--active">Music</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>

  <section class="page-header">
    <div class="container">
      <div class="page-header__inner">
        <div class="label reveal">Listen</div>
        <div class="rule reveal"></div>
        <h1 class="reveal">Music</h1>
      </div>
    </div>
  </section>

  <section class="music-section">
    <div class="container">

      <div class="music-block reveal" id="recordings">
        <div class="label music-guitar-subhead"></div>
        <div class="rule"></div>
        <h2 class="music-guitar-heading"></h2>
        <p class="music-guitar-body" style="margin-top:1rem;max-width:52ch;"></p>

        <div class="streaming__links" style="margin-top:2rem;">
          <a href="#" data-key="spotify"    class="btn btn--primary" style="opacity:.4;pointer-events:none;">Spotify</a>
          <a href="#" data-key="appleMusic" class="btn btn--ghost"   style="opacity:.4;pointer-events:none;">Apple Music</a>
        </div>

        <div id="spotify-embed" style="margin-top:2.5rem;max-width:500px;"></div>
      </div>

      <div class="music-divider"></div>

      <div class="music-block reveal reveal-delay-1">
        <div class="label music-choral-subhead"></div>
        <div class="rule"></div>
        <h2 class="music-choral-heading"></h2>
        <p class="music-choral-body" style="margin-top:1rem;max-width:52ch;"></p>
        <div style="margin-top:2rem;">
          <a href="shop.html" class="btn btn--primary music-choral-cta">Browse Choral Scores</a>
        </div>
      </div>

    </div>
  </section>

  <!-- ── PUBLISHERS ───────────────────────────────────────────────── -->
  <section class="publishers-section">
    <div class="container">
      <div class="reveal">
        <div class="label">In Print</div>
        <div class="rule"></div>
        <h2>Published Works</h2>
      </div>
      <!-- Populated by main.js from config.js → SITE.publishers -->
      <div class="publishers-grid reveal reveal-delay-1" id="publishers-grid"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer__inner">
        <div>
          <div class="footer__logo"></div>
          <div class="footer__notes"></div>
        </div>
        <ul class="footer__links">
          <li><a href="about.html">About</a></li>
          <li><a href="music.html">Music</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
